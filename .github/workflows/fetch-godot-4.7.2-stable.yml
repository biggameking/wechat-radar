name: Fetch Godot 4.7.2 Stable Runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-godot-4.7.2-stable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download exact stable Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          file="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 4 --retry-all-errors --output "$file" "$url"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $file" | sha256sum --check --strict
          stat --printf='%n %s bytes\n' "$file"

      - name: Upload verified runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-stable-linux-x86_64
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
